<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLORES DE FONDO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <header class="mb-8 text-center">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-[#0f172a] tracking-tight">
            COLORES DE FONDO
        </h1>
    </header>

    <main class="w-full max-w-4xl shadow-2xl overflow-hidden rounded-sm">
        <div class="grid grid-cols-4 w-full">

            <div class="col-span-4 bg-blue-gray-header color-box text-xl md:text-2xl pt-5 pb-5">
                Blue Gray
            </div>

            <div class="col-span-1 bg-cool-gray color-box">
                Cool gray
            </div>
            <div class="col-span-1 bg-warm-gray color-box">
                Warm Gray
            </div>
            <div class="col-span-1 bg-amber color-box">
                Amber
            </div>
            <div class="col-span-1 bg-green color-box">
                Green
            </div>

            <div class="col-span-1 bg-gray color-box">
                Gray
            </div>
            <div class="col-span-1 bg-red color-box">
                Red
            </div>
            <div class="col-span-1 bg-yellow color-box">
                Yellow
            </div>
            <div class="col-span-1 bg-emerald color-box">
                Emerald
            </div>

            <div class="col-span-1 bg-true-gray color-box">
                True Gray
            </div>
            <div class="col-span-1 bg-orange color-box">
                Orange
            </div>
            <div class="col-span-1 bg-lime color-box">
                Lime
            </div>
            <div class="col-span-1 bg-teal color-box">
                Teal
            </div>

            <div class="col-span-1 bg-fuchsia color-box">
                Fuchsia
            </div>
            <div class="col-span-1 bg-pink color-box">
                Pink
            </div>
            <div class="col-span-2 bg-rose color-box">
                Rose
            </div>

            <div class="col-span-1 bg-purple color-box">
                Purple
            </div>
            <div class="col-span-1 bg-violet color-box">
                Violet
            </div>
            <div class="col-span-1 bg-indigo color-box">
                Indigo
            </div>
            <div class="col-span-1 bg-blue color-box">
                Blue
            </div>

            <div class="col-span-2 bg-sky color-box">
                Sky
            </div>
            <div class="col-span-2 bg-cyan color-box">
                Cyan
            </div>

        </div>
    </main>

</body>
</html>
